name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (light: no ML extras, no model downloads)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Smoke-test the end-to-end pipeline on synthetic data
        run: pls demo --out /tmp/demo_results.json

      - name: Smoke-test multi-backend benchmarking
        run: |
          pls build --db data/sample/trials.json --out /tmp/ex.jsonl
          pls split --examples /tmp/ex.jsonl --out-dir /tmp/splits
          pls benchmark --examples /tmp/splits/test.jsonl --backends "lead-1,lead-2" --out-dir /tmp/bench

      - name: Smoke-test the RAG pipeline (DB + retrieval eval)
        env:
          PLS_DATABASE_URL: sqlite:////tmp/ci_pls.db
        run: |
          alembic upgrade head
          pls index --records data/sample/trials.json
          pls ask --query "What adverse events were reported?" --k 3
          pls rag-eval --examples /tmp/ex.jsonl --k 5

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check + build
        run: npm run build

      - name: Test
        run: npm test
